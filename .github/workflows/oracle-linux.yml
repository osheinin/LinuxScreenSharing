name: Oracle Linux Apple clipboard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ['7', '8', '9']
    steps:
      - uses: actions/checkout@v4
      - name: Build server and run clipboard tests
        run: |
          docker build --build-arg OL_VERSION=${{ matrix.release }} \
            --file packaging/oracle-linux/Dockerfile \
            --output type=local,dest=dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tigervnc-apple-ol${{ matrix.release }}-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
